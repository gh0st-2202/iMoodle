[versions]
# Herramientas de build
agp = "9.4.1"
ksp = "2.3.14"
viewbinding = "9.4.0"

# Kotlin y concurrencia
coroutines = "1.11.0"

# AndroidX / Material
activity = "1.13.0"
appcompat = "1.8.0"
constraintlayout = "2.2.2"
coreKtx = "1.19.1"
fragment = "1.9.1"
material = "1.14.0"
swiperefreshlayout = "1.2.0"
webkit = "1.12.1"

# Persistencia e inyección
hilt = "2.60.1"
room = "2.8.5"

# Red e imágenes
okhttp = "5.5.1"
# Coil 3.5+ se compila con Kotlin 2.4 y el Kotlin integrado de AGP 9.4
# todavía lee metadatos hasta 2.3. Subir Coil cuando AGP lo permita.
coil = "3.4.0"

# UI
markwon = "4.6.2"

# Tests
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"
testCore = "1.7.0"
mockk = "1.14.12"
mockwebserver = "5.5.1"
orgJson = "20260814"
robolectric = "4.18"
turbine = "1.2.1"

[libraries]
# AndroidX / Material
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
material = { module = "com.google.android.material:material", version.ref = "material" }

# Room
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }

# Red e imágenes
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-urlconnection = { module = "com.squareup.okhttp3:okhttp-urlconnection", version.ref = "okhttp" }
coil-core = { module = "io.coil-kt.coil3:coil", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
coil-svg = { module = "io.coil-kt.coil3:coil-svg", version.ref = "coil" }

# Markdown
markwon-core = { module = "io.noties.markwon:core", version.ref = "markwon" }

# Concurrencia
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# ViewBinding
viewbinding = { module = "com.android.databinding:viewbinding", version.ref = "viewbinding" }

# Tests
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "testCore" }
junit = { module = "junit:junit", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockwebserver" }
org-json = { module = "org.json:json", version.ref = "orgJson" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
